# Render blueprint for finbee parkavimas (ADR-0004). Starter, never free: the free plan sleeps,
# and it blocks outbound SMTP, so no sign-in code or notification email could be sent.
# One worker: the background loop that sends notifications and the evening Reminder lives in
# the process. The values marked sync: false are typed into Render's form, never committed.
services:
  - type: web
    name: finbee-parking
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 1 --threads 8 -b 0.0.0.0:$PORT 'app:production()'
    disk:
      name: parking-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: COOKIE_SECURE
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: FIRST_ADMIN_EMAIL
        sync: false
      - key: PARKING_SENDER_EMAIL
        sync: false
      - key: PARKING_SENDER_APP_PASSWORD
        sync: false
      - key: APP_URL
        sync: false
