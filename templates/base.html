<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Parkavimas{% endblock %} · finbee</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="Parkavimas">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ 'error' if category == 'error' }}" role="status">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% if me %}
<nav class="tabs" aria-label="Pagrindinis meniu">
  <a href="{{ url_for('today_page') }}" class="{{ 'active' if tab == 'day' }}">
    <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
    Diena</a>
  <a href="{{ url_for('mine') }}" class="{{ 'active' if tab == 'mine' }}">
    <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h9"/></svg>
    Mano</a>
  <a href="{{ url_for('profile') }}" class="{{ 'active' if tab == 'profile' }}">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="8.5" r="3.5"/><path d="M5 20c1-4 4-6 7-6s6 2 7 6"/></svg>
    Profilis</a>
  {% if me.is_admin %}
  <a href="{{ url_for('admin_home') }}" class="{{ 'active' if tab == 'admin' }}">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
    Admin</a>
  {% endif %}
</nav>
{% endif %}
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
